name: "🐞 Bug Report"
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels:

- bug
assignees:
- mlhamatzbt
body:
- type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report!
        Please make sure you've checked existing issues first.

- type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Short, clear description of the bug.
      placeholder: e.g., Crash when uploading file
    validations:
      required: true

- type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: A step-by-step description of how to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

- type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The upload should complete successfully.
    validations:
      required: true

- type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Describe the failure or error message.
    validations:
      required: true

- type: input
    id: environment
    attributes:
      label: Environment
      description: Provide environment details (OS, browser, branch, commit, etc.)
      placeholder: macOS 14 / Chrome / dev branch / 7d4f9b3
    validations:
      required: false

- type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste relevant logs, stack traces, or screenshots.
      placeholder: Paste logs or drag & drop images here.
    validations:
      required: false
- type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that may help in resolving the issue.
      placeholder: Add any other context about the problem here.
    validations:
      required: false
